<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique en ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>

        <div class="logo">Ma Boutique</div>

        <nav>
            <a href="#">Accueil</a>
            <a href="#">Produits</a>
            <a href="#">Contact</a>
        </nav>

    </header>


    <!-- SECTION PRINCIPALE -->
    <section class="hero">

        <h1>Bienvenue dans notre boutique</h1>

        <p>Trouvez le meilleur des prix sur notre site de vente en ligne </p>

        <button class="btn">Voir les produits</button>

    </section>


    <!-- TITRE -->
    <h1 class="titre">Nos Produits</h1>


    <!-- CONTENEUR -->
    <div class="container">

        <!-- PRODUIT 1 -->
        <div class="card">

            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1200&auto=format&fit=crop" alt="telephone">

            <h2>Téléphone</h2>

            <p class="prix">220 000 FCFA</p>

            <button>Ajouter au panier</button>

        </div>


        <!-- PRODUIT 2 -->
        <div class="card">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop" alt="chaussure">

            <h2>Chaussures</h2>

            <p class="prix">25 000 FCFA</p>

            <button>Ajouter au panier</button>

        </div>


        <!-- PRODUIT 3 -->
        <div class="card">

            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop" alt="casque">

            <h2>Casque Audio</h2>

            <p class="prix">35 000 FCFA</p>

            <button>Ajouter au panier</button>

        </div>

    </div>
     

    


    <!-- FOOTER -->
    <footer>
        <p>© 2026 Ma Boutique</p>
    </footer>

</body>
</html>
