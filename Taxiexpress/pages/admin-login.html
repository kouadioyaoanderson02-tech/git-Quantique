<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — TaxiExpress</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="admin-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-taxi"></i> Taxi<span>Express</span>
      </div>
      <h2>Espace Administrateur</h2>
      <p class="login-sub">Connectez-vous pour accéder au tableau de bord</p>

      <form id="loginForm" onsubmit="connecter(event)">
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Identifiant</label>
          <input type="text" id="username" placeholder="admin" required/>
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-lock"></i> Mot de passe</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="••••••••" required/>
            <button type="button" onclick="togglePassword()"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
          </div>
        </div>
        <p class="error-msg" id="errorMsg" style="display:none;"><i class="fa-solid fa-circle-exclamation"></i> Identifiants incorrects</p>
        <button type="submit" class="btn-primary" style="width:100%;padding:14px;margin-top:8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Se connecter
        </button>
      </form>

      <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Retour au site</a>
    </div>
  </div>

  <script>
    function connecter(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === 'admin' && pass === 'admin123') {
        window.location.href = 'admin-dashboard.html';
      } else {
        document.getElementById('errorMsg').style.display = 'flex';
      }
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }
  </script>
</body>
</html>
